[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "creator-workflow-kit"
version = "0.1.0"
description = "A local-first, review-gated starter kit for creator video workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ivan Vydrin" }]
dependencies = [
  "mcp>=1.10,<2",
  "playwright>=1.50,<2",
  "google-api-python-client>=2.160,<3",
  "google-auth-oauthlib>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
creator-kit = "creator_kit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/creator_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
