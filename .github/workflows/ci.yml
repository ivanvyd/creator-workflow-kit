name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install package and test tools
        run: python -m pip install -e '.[dev]'
      - name: Install Playwright browser dependencies
        run: python -m playwright install --with-deps chromium
      - name: Offline unit tests
        run: python -m pytest
      - name: Scan repository files without reading credential directories
        run: python tools/scan_sensitive.py
      - name: Small local render smoke (no credentials or services)
        run: python -m creator_kit demo --slug ci-smoke --width 320 --height 180 --fps 3 --duration 8
      - name: Inspect silent demo
        run: python -m creator_kit qc runs/ci-smoke/demo.mp4
